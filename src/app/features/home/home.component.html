<div class="h-1/20 bg-sky-200">
  <app-header></app-header>
</div>
<!-- Top Spacer 1/5th of page -->
<div class="h-auto md:h-2/10 w-full">
  <div class="text-3xl md:text-5xl text-center text-black pt-8 md:pt-30" id="title">The Paralegal's Sidekick</div>
</div>
<!-- Main Content 3/5th of page -->
<div class="h-auto md:h-2/5 w-full flex flex-col md:flex-row">
  <!-- Labels -->
  <div class="grid grid-rows-2 gap-2 w-full md:w-1/2 h-full">
    <div class="p-4 text-black text-lg md:text-2xl text-center md:text-right pt-4 md:pt-20 choose" id="choose-form">Choose Form</div>
    <div class="p-4 text-black text-lg md:text-2xl text-center md:text-right choose" id="choose-profile">Choose Existing Client Profile</div>
  </div>


  <!-- Dropdown Selects -->
  <div class="h-full w-full md:w-1/2 flex flex-col" [formGroup]="clientAndFormSelect">
    <div class="h-auto md:h-1/2 w-full">
      <mat-form-field class="block w-full max-w-xs mx-auto md:w-auto md:max-w-none md:mx-0 md:pl-40 md:pt-15">
        <mat-select (selectionChange)="onFormChange($event)" formControlName="formSelect">
          @for (form of forms; track form) {
            <mat-option [value]="form.formName">{{form.formName}}</mat-option>
          }
        </mat-select>
      </mat-form-field>
    </div>
    <div class="h-auto md:h-1/2 w-full">
      <mat-form-field class="block w-full max-w-xs mx-auto md:w-auto md:max-w-none md:mx-0 md:pl-40">
        <mat-select (selectionChange)="onClientChange($event)" formControlName="clientSelect">
          @for (client of this.sqliteClients; track client) {
            <mat-option [value]="client.name">{{client.name}}</mat-option>
          }
        </mat-select>
      </mat-form-field>
    </div>
  </div>
</div>

<!-- Bottom Spacer 1/5th of page -->
<div class="h-auto md:h-3/10 w-full text-center py-6 md:py-0">

  <div class="flex flex-col lg:grid lg:grid-cols-4 gap-3 lg:gap-2 w-full h-full items-center">
    <div class="hidden lg:block p-4"></div>
    <button matButton="filled" (click)="proceedToEditProfiles()">
      <h1 class="text-base md:text-lg lg:text-2xl font-light">Edit Client Profiles</h1>
    </button>

    <button matButton="filled" class="lg:pl-30" (click)="proceedToForm()">
      <h1 class="text-base md:text-lg lg:text-2xl font-light">Fill Out Form</h1>
    </button>


    <div class="hidden lg:block p-4"></div>
  </div>

</div>
