<!-- Header Containing form and profile name - 15% of page -->
<div class="h-1/20 w-full bg-sky-50">

</div>
<!-- Top Spacer Containing Form Name - 15% of Page-->
<div class="h-15/100 w-full bg-sky-100 flex items-center justify-center">
  <div class="text-3xl text-black">{{formName}} form information for {{clientName}}</div>
</div>

<!-- Form - 70% of page -->
<div class="h-7/10 w-full bg-sky-200 flex flex-row" [formGroup]="form">
  <!-- Field Labels -->
  <div class="grid grid-rows-3 gap-2 w-1/2 h-full">
    <div class="p-4 text-black text-2xl text-right flex items-center justify-end">Client Name</div>
    <div class="p-4 text-black text-2xl text-right flex items-center justify-end">Client DOB</div>
    <div class="p-4 text-black text-2xl text-right flex items-center justify-end">Client Address</div>
  </div>

  <!-- Inputs -->
  <div class="h-full w-1/2 flex flex-col">
    <div class="h-1/3 w-full flex items-center pl-8">
      <mat-form-field class="w-72">
        <mat-label>Client Name</mat-label>
        <textarea matInput formControlName="clientName" rows="1"></textarea>
      </mat-form-field>
    </div>
    <div class="h-1/3 w-full flex items-center pl-8">
      <mat-form-field class="w-72">
        <mat-label>Client DOB</mat-label>
        <input matInput [matDatepicker]="dobPicker" formControlName="clientDOB" />
        <mat-datepicker-toggle matIconSuffix [for]="dobPicker" />
        <mat-datepicker #dobPicker />
      </mat-form-field>
    </div>
    <div class="h-1/3 w-full flex items-center pl-8">
      <mat-form-field class="w-72">
        <mat-label>Client Address</mat-label>
        <textarea matInput formControlName="clientAddress" rows="1"></textarea>
      </mat-form-field>
    </div>
  </div>
</div>

<!-- Footer - 10% of Page -->
<div class="h-2/20 w-full bg-sky-400">
  
</div>
